<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASCII Portrait Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>My ASCII Portrait</h1>

<input type="file" id="upload" accept="image/*">

<div id="controls">
    <label>Contrast</label>
    <input type="range" id="contrast" min="0.5" max="3" step="0.1" value="1.5">

    <label>Size</label>
    <input type="range" id="size" min="80" max="300" value="180">
</div>

<pre id="ascii"></pre>

<script src="script.js"></script>
</body>
</html>
